name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPMETRICA_API_KEY: ci-placeholder
      YANDEX_SQUARE_AD_ID: demo-ci-square
      YANDEX_INTERSTITIAL_AD_ID: demo-ci-interstitial
      YANDEX_CLIENT_ID: ci-yandex-client
      VK_APP_ID: "1"
      AUTH_EXCHANGE_URL: https://example.invalid/exchangeExternalToken

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The production google-services.json stays outside Git. This temporary
      # Firebase config only lets CI compile the app; its APK is never published.
      - name: Create non-production Firebase build config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1",
              "project_id": "breathing-trainer-ci",
              "storage_bucket": "breathing-trainer-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1:android:00000000000000000000000000000000",
                "android_client_info": {
                  "package_name": "com.glazev.breathingtrainer"
                }
              },
              "oauth_client": [{
                "client_id": "1-ci.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [{
                    "client_id": "1-ci.apps.googleusercontent.com",
                    "client_type": 3
                  }]
                }
              }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Test Cloud Functions
        run: npm test
        working-directory: functions

      - name: Test, lint, and build release APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
